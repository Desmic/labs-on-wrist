<!doctype html><html><body style="margin:0;background:#222"><canvas id="c"></canvas>
<script type="module">
import * as THREE from "three";
import { loadHumanAsset, makeHuman } from "../src/gl/human.js";
const r = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true });
r.setSize(1600, 900);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x30363a);
sc.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(3,5,4); sc.add(d);
const cam = new THREE.PerspectiveCamera(30, 16/9, 0.1, 100);
const q = new URLSearchParams(location.search);
const view = q.get("view") || "front";
await loadHumanAsset("/models/xbot.glb");
const tests = JSON.parse(decodeURIComponent(q.get("t") || "[]"));
tests.forEach((t, i) => {
  const h = makeHuman({ pose: t.pose || "stand" });
  h.root.position.x = (i - (tests.length - 1) / 2) * 1.3;
  if (view === "side") h.root.rotation.y = Math.PI / 2;
  h.update(0.5);
  if (t.bone) { const b = h.bones[t.bone]; const ax = { x: new THREE.Vector3(1,0,0), y: new THREE.Vector3(0,1,0), z: new THREE.Vector3(0,0,1) }[t.axis]; b.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(ax, t.a)); }
  sc.add(h.root);
});
const W = tests.length * 1.3;
cam.position.set(0, 1.3, W * 1.05 + 3);
cam.lookAt(0, 0.9, 0);
r.render(sc, cam); document.title = "done";
</script></body></html>
